render:
  dpi: 300
  image_format: png

chunking:
  header_ratio: 0.12
  body_start_ratio: 0.12
  body_end_ratio: 0.98
  chunk_height_ratio: 0.35
  overlap_ratio: 0.25
  attach_header: true

total_extraction:
  enabled: true
  header_ratio: 0.12
  summary_start_ratio: 0.62
  summary_end_ratio: 0.98
  attach_header: true
  prompt_path: prompts/vision_extract_totals.md

vision:
  provider: gemini
  model: gemini-3.1-flash-lite
  api_key_env: GEMINI_API_KEY
  prompt_path: prompts/vision_extract_table.md
  request_delay_seconds: 5
  timeout_seconds: 120
  cache_enabled: true
  max_retries: 1

review:
  html_title: Card Statement Review
  show_chunk_images: true
  show_raw_json_paths: true

output:
  pages_dir: pages
  chunks_dir: chunks
  total_chunks_dir: total_chunks
  cache_dir: cache
  merged_dir: merged
  profiles_dir: profiles
  summary_filename: summary.json

export:
  excel_filename: result.xlsx
