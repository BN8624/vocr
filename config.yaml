render:
  dpi: 300
  image_format: png

chunking:
  header_ratio: 0.12
  body_start_ratio: 0.12
  body_end_ratio: 0.98
  chunk_height_ratio: 0.35
  overlap_ratio: 0.25
  attach_header: true
  bottom_guard_enabled: true
  bottom_guard_start_ratio: 0.90
  bottom_guard_end_ratio: 0.98

total_extraction:
  enabled: true
  header_ratio: 0.12
  summary_start_ratio: 0.62
  summary_end_ratio: 0.98
  attach_header: true
  prompt_path: prompts/vision_extract_totals.md

extraction:
  mode: chunk            # chunk(기존 겹침 청크) | page(sop010식 페이지 단위 헤더키 JSON)
  page_prompt_path: prompts/page_extract_jsonl.md
  page_model: gemma-4-31b-it   # page 모드 전용 모델. flash-lite 열밀림을 잡음(추론 off 자동 적용)

vision:
  provider: gemini
  model: gemini-3.1-flash-lite
  api_key_env: GEMINI_API_KEY
  prompt_path: prompts/vision_extract_table.md
  request_delay_seconds: 5
  timeout_seconds: 120
  cache_enabled: true
  max_retries: 4
  concurrency: 2          # page 모드 동시 처리 페이지 수
  rpm_limit: 15           # page 모드 RPM 한도(Gemini 3.1 Flash Lite=15, 슬롯 = rpm_limit - 2)
  max_output_tokens: 65535
  adaptive_preprocess: true

review:
  html_title: Card Statement Review
  show_chunk_images: true
  show_raw_json_paths: true

output:
  pages_dir: pages
  chunks_dir: chunks
  total_chunks_dir: total_chunks
  cache_dir: cache
  merged_dir: merged
  profiles_dir: profiles
  summary_filename: summary.json

export:
  excel_filename: result.xlsx
